<div class="page">
  <header class="hero">
    <p class="tag">Professional Portfolio</p>
    <h1>{{ name }}</h1>
    <h2>{{ title }}</h2>
    <p class="summary">{{ summary }}</p>
  </header>

  <section class="section">
    <h3>Core Skills</h3>
    <ul class="chip-list">
      <li *ngFor="let skill of skills">{{ skill }}</li>
    </ul>
  </section>

  <section class="section">
    <h3>Experience</h3>
    <article class="card" *ngFor="let item of experiences">
      <div class="card-header">
        <h4>{{ item.role }}</h4>
        <span>{{ item.duration }}</span>
      </div>
      <p class="company">{{ item.company }}</p>
      <ul>
        <li *ngFor="let highlight of item.highlights">{{ highlight }}</li>
      </ul>
    </article>
  </section>

  <section class="section">
    <h3>Featured Projects</h3>
    <article class="card" *ngFor="let project of projects">
      <h4>{{ project.name }}</h4>
      <p>{{ project.description }}</p>
      <p class="impact">{{ project.impact }}</p>
    </article>
  </section>
</div>
